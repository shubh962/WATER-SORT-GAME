<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Water Sort</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#05070f;font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif;color:#eaf6ff;overflow:hidden}
button{font-family:inherit}
#game{position:relative;margin:0 auto;height:100%;max-width:480px;overflow:hidden;
  background:radial-gradient(90% 60% at 50% 35%,#1b2350 0%,#0c1024 62%,#080a18 100%)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

/* ---- HUD ---- */
#title{position:absolute;left:64px;right:120px;top:20px;text-align:center;pointer-events:none}
#lvl{font-size:32px;font-weight:700;text-shadow:0 3px 0 #0a3d5c;white-space:nowrap}
#sub{height:24px;margin-top:2px;white-space:nowrap}
.lvlin{animation:lvlin .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes lvlin{0%{transform:translateY(-16px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
.tag{display:inline-block;padding:1px 10px;border-radius:10px;font-size:13px;font-weight:700;margin:0 3px;color:#0b1020}
.t-easy{background:#7be04a}.t-med{background:#ffd23f}.t-hard{background:#ff9a3d}.t-exp{background:#ff5c7a}
.t-mas{background:linear-gradient(90deg,#9b5cf6,#f472d0);color:#fff}.t-leg{background:linear-gradient(90deg,#ffd23f,#ff9a3d);color:#3a2000}
.t-q{background:#4d7cff;color:#fff}

#timer{position:relative;width:170px;height:16px;margin:5px auto 0;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#timer.hide{display:none}
#tfill{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#37d3c2,#7be04a)}
#timer.low #tfill{background:#ff5c7a;animation:blink .5s infinite}
#timer.low{animation:shk .25s infinite}
@keyframes blink{50%{opacity:.5}}
@keyframes shk{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
#ttxt{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}

#menuBtn{position:absolute;left:14px;top:22px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);
  display:grid;place-items:center;cursor:pointer}
#menuBtn svg{width:22px;height:22px}
#menuBtn:active{transform:scale(.92)}

#coins{position:absolute;right:14px;top:22px;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 6px;border:0;color:#eaf6ff;
  background:rgba(255,255,255,.1);border-radius:20px;font-weight:700;font-size:18px;cursor:pointer}
#coins i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc21f 60%,#c98500);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
#coins em{font-style:normal;width:24px;height:24px;border-radius:50%;background:#7be04a;color:#123;display:grid;place-items:center;font-size:18px;line-height:1}
#coins.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.28)}}
#noads{position:absolute;right:14px;top:66px;border:0;border-radius:14px;padding:4px 12px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(#ff6a6a,#d63b3b);box-shadow:0 3px 0 #8d1f1f;animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---- bottom bar ---- */
#bar{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:16px}
#bar button{position:relative;width:60px;height:60px;border-radius:50%;border:0;color:#fff;font:700 28px Fredoka,sans-serif;
  display:grid;place-items:center;cursor:pointer;background:linear-gradient(#37d3c2,#1a9aa8);
  box-shadow:0 5px 0 #0d6470,0 10px 18px rgba(0,0,0,.35);transition:transform .08s}
#bar button:active{transform:translateY(3px) scale(.96);box-shadow:0 2px 0 #0d6470,0 4px 10px rgba(0,0,0,.35)}
#bar button:disabled{filter:grayscale(1) brightness(.55);transform:none}
#bar b{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#ffd23f;
  color:#3a2a00;font-size:13px;display:grid;place-items:center}
#bar b.ad{background:#9b5cf6;color:#fff}
#bar b.bump{animation:pop .4s}


#toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,10px);opacity:0;padding:10px 18px;border-radius:14px;
  background:rgba(8,10,24,.92);border:1px solid #2b4a70;font-size:15px;text-align:center;max-width:86%;transition:.25s;pointer-events:none;z-index:70}
#toast.on{opacity:1;transform:translate(-50%,0)}

#tierB{position:absolute;left:50%;top:150px;transform:translate(-50%,-30px) scale(.6);opacity:0;padding:8px 26px;border-radius:24px;font-size:26px;font-weight:700;
  background:linear-gradient(90deg,#9b5cf6,#f472d0);box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap;z-index:15}
#tierB.show{animation:tierin 2.6s both}
@keyframes tierin{0%{opacity:0;transform:translate(-50%,-30px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}18%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px) scale(1)}}

.fc{position:absolute;width:22px;height:22px;border-radius:50%;z-index:80;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc21f 60%,#c98500);box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ---- overlays / panels ---- */
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,7,16,.76);transition:opacity .3s;z-index:30}
.ov.hide{opacity:0;pointer-events:none}
.ov:not(.hide) .card,.ov:not(.hide) .panel{animation:cardin .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardin{0%{transform:scale(.55) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.card{text-align:center;padding:0 24px}
.card h1{font-size:46px;line-height:1;margin:0 0 14px;color:#ffd23f;text-shadow:0 4px 0 #b3541a}
#lose h1{color:#ff5c7a;text-shadow:0 4px 0 #7a1f36}
#stars{display:flex;justify-content:center;gap:10px;height:66px;margin-bottom:10px}
#stars i{font-style:normal;font-size:58px;line-height:66px;color:#2a3155}
#stars i.on{color:#ffd23f;text-shadow:0 4px 0 #b3541a;animation:starpop .55s both cubic-bezier(.2,1.6,.4,1)}
@keyframes starpop{0%{transform:scale(0) rotate(-50deg);opacity:0}100%{transform:none;opacity:1}}
.card p{font-size:24px;margin:0 0 20px;color:#bfeaff;font-weight:700}

.btn{display:block;margin:10px auto 0;font:700 26px Fredoka,sans-serif;color:#fff;border:0;padding:12px 40px;border-radius:40px;cursor:pointer;
  background:linear-gradient(#7be04a,#3fae1f);box-shadow:0 6px 0 #26761a,0 12px 20px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.alt{background:linear-gradient(#a06bff,#6a3fd8);box-shadow:0 6px 0 #43258f,0 12px 20px rgba(0,0,0,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #26761a}
.btn.pulse{animation:pulse 1.4s infinite}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.lnk{background:none;border:0;color:#8fb6ff;font-size:15px;cursor:pointer;padding:8px 10px;text-decoration:underline}

.panel{width:min(90%,380px);max-height:86%;overflow:auto;background:linear-gradient(#232b63,#161b45);border:2px solid #3a4a94;border-radius:24px;padding:16px 16px 14px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center}
.panel h2{margin:0 0 4px;font-size:28px}
.panel p{margin:6px 0 10px;color:#bfeaff;font-size:17px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ph h2{flex:1}
.x{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:16px;cursor:pointer}
.prod{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.07);margin:8px 0;text-align:left}
.prod .ic{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:20px;font-weight:700;background:rgba(255,255,255,.1)}
.prod .ic.coin{background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc21f 60%,#c98500);color:#5a3a00}
.prod .ic.ad{background:#d63b3b;text-decoration:line-through}
.prod .ic.vid{background:#6a3fd8}
.prod .tx{flex:1;min-width:0}
.prod b{display:block;font-size:17px}
.prod small{color:#9fb4e8;font-size:13px}
.prod .tagp{display:inline-block;margin-left:6px;padding:0 8px;border-radius:8px;background:#ffd23f;color:#3a2a00;font-size:11px}
.buy{flex:none;border:0;border-radius:14px;padding:9px 14px;font:700 16px Fredoka,sans-serif;color:#fff;cursor:pointer;
  background:linear-gradient(#7be04a,#3fae1f);box-shadow:0 4px 0 #26761a}
.buy.alt{background:linear-gradient(#a06bff,#6a3fd8);box-shadow:0 4px 0 #43258f}
.buy:active{transform:translateY(2px);box-shadow:0 2px 0 #26761a}
.buy.own{background:#2b3466;box-shadow:none;color:#9fb4e8}
.links{display:flex;justify-content:center;gap:8px;margin-top:4px}
#adCount{font-size:44px;font-weight:700;margin:12px 0}

<script>
/* =====================================================================
   HOST BRIDGE
   Inside the Flutter app this page talks to Dart through the JavaScript
   channel "FlutterHost". Flutter is the source of truth for coins, level
   progress, purchases, settings and ads. In a normal browser a small mock
   host is used so you can still develop and test the game there.
   ===================================================================== */
const HOSTCH = window.FlutterHost || null;
const IN_APP = !!HOSTCH;
const DEFAULT_SKIN = {glass:'#5bb8ea', glow:'#a8e8ff', tint:'rgba(140,170,255,.08)', rim:'rgba(120,200,255,.55)', cork:'#c98b4b', corkDark:'#a56a30'};
const DEFAULT_BG = {c1:'#1b2350', c2:'#0c1024', c3:'#080a18', bub:'rgba(120,190,255,.07)'};
const DEFAULT_PRICES = {hint:100, undo:40, bottle:100, time:50, skip:150};
const TUNE = {EXTRA_TIME:30, EXTRA_UNDOS:3};

const Host = {
  seq: 0, pending: {}, listeners: {},
  call(type, payload, timeoutMs){
    if (!IN_APP) return MockHost.call(type, payload);
    return new Promise(resolve => {
      const id = ++this.seq;
      const tm = setTimeout(() => { if (this.pending[id]){ delete this.pending[id]; resolve({error:'timeout'}); } }, timeoutMs || 10000);
      this.pending[id] = v => { clearTimeout(tm); resolve(v); };
      try { HOSTCH.postMessage(JSON.stringify({id, type, payload: payload || {}})); }
      catch(e){ delete this.pending[id]; clearTimeout(tm); resolve({error:String(e)}); }
    });
  },
  post(type, payload){                                   // fire and forget
    if (!IN_APP){ MockHost.call(type, payload); return; }
    try { HOSTCH.postMessage(JSON.stringify({id:0, type, payload: payload || {}})); } catch(e){}
  },
  on(name, fn){ (this.listeners[name] = this.listeners[name] || []).push(fn); }
};
window.__hostReply = (id, data) => { const f = Host.pending[id]; if (f){ delete Host.pending[id]; f(data); } };
window.__hostEvent = (name, data) => { (Host.listeners[name] || []).forEach(fn => { try { fn(data); } catch(e){ console.error(e); } }); };
window.addEventListener('error', e => Host.post('log', {msg: String(e.message), line: e.lineno}));

// Browser-only stand-in for Flutter, so the page also works when opened directly in Chrome.
const MockHost = (() => {
  let st = {coins:120, level:1, noAds:false, pro:false, muted:false, haptics:true, kv:{}};
  try { Object.assign(st, JSON.parse(localStorage.getItem('ws_mock') || '{}')); } catch(e){}
  const persist = () => { try { localStorage.setItem('ws_mock', JSON.stringify(st)); } catch(e){} };
  let since = 0, lastAd = 0;
  const ok = v => Promise.resolve(v);
  return { call(type, p){
    p = p || {};
    switch (type){
      case 'boot': return ok({coins:st.coins, level:st.level, noAds:st.noAds, pro:st.pro, muted:st.muted, haptics:st.haptics, kv:st.kv,
                              prices:DEFAULT_PRICES, skin:DEFAULT_SKIN, bg:DEFAULT_BG, debug:true});
      case 'coins.add': st.coins += p.amount; persist(); return ok({coins:st.coins});
      case 'coins.spend':
        if (st.coins >= p.amount){ st.coins -= p.amount; persist(); return ok({ok:true, coins:st.coins}); }
        return ok({ok:false, coins:st.coins});
      case 'progress.level': st.level = Math.max(st.level, p.level); persist(); return ok({});
      case 'settings.muted': st.muted = !!p.muted; persist(); return ok({});
      case 'kv.set': st.kv[p.key] = p.value; persist(); return ok({});
      case 'ads.interstitial':
        since++;
        if (p.level >= 4 && since >= 2 && Date.now() - lastAd > 60000){ since = 0; lastAd = Date.now(); return mockAd('interstitial ad', 3, false).then(() => ({shown:true})); }
        return ok({shown:false});
      case 'ads.rewarded': return mockAd('rewarded video', 5, true).then(r => ({rewarded:r}));
      case 'nav': toast('Native screen "' + p.to + '" only exists inside the Flutter app'); return ok({});
      default: return ok({});
    }
  }};
})();
function mockAd(label, secs, rewarded){
  return new Promise(res => {
    openM('adov');
    let left = secs; const btn = $('adClose');
    $('adTitle').textContent = 'Test ' + label;
    const upd = () => {
      if (left > 0){ $('adCount').textContent = left + 's'; btn.textContent = rewarded ? 'Skip (no reward)' : 'Please wait'; btn.disabled = !rewarded; }
      else { $('adCount').textContent = rewarded ? 'Reward earned' : 'Done'; btn.textContent = 'Close'; btn.disabled = false; }
    };
    upd();
    const timer = setInterval(() => { if (left > 0){ left--; upd(); } if (left <= 0) clearInterval(timer); }, 1000);
    btn.onclick = () => { clearInterval(timer); closeM('adov'); res(left <= 0); };
  });
}

/* Game-side mirror of the state Flutter owns. */
const S = {level:1, coins:0, noAds:false, pro:false, haptics:true, kv:{}, prices:Object.assign({}, DEFAULT_PRICES)};
const isOn = v => v === true || v === 1 || v === '1' || v === 'true';
let SYMS = false;                                              // color-blind mode: a shape on every layer
let muted = false, SKIN = Object.assign({}, DEFAULT_SKIN), BUB = DEFAULT_BG.bub;
function applyBg(bg){
  BUB = bg.bub || BUB;
  const g = document.getElementById('game');
  if (!g) return;

  if (bg.assetPath){
    const safePath = String(bg.assetPath)
      .replace(/\\/g, '/')
      .replace(/'/g, "\\'");
    g.style.background =
      'linear-gradient(rgba(5,7,16,.22),rgba(5,7,16,.48)), url(\'' +
      safePath +
      '\') center / cover no-repeat';
    g.style.backgroundColor = bg.c3 || '#080a18';
    g.style.backgroundAttachment = 'scroll';
  } else {
    g.style.background =
      'radial-gradient(90% 60% at 50% 35%,' +
      (bg.c1 || '#1b2350') + ' 0%,' +
      (bg.c2 || '#0c1024') + ' 62%,' +
      (bg.c3 || '#080a18') + ' 100%)';
    g.style.backgroundAttachment = 'scroll';
  }
}

/* =====================================================================
   STATE
   ===================================================================== */
let CAP = 4;
const PAL = ['#ff5c7a','#ff9a3d','#ffd23f','#9be564','#2ecc8f','#22c1d6','#4d7cff','#9b5cf6','#f472d0','#b5651d','#e8ecf5','#7a1f5c'];
const UNK = '#2a2a48';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W=0, H=0, dpr=1, tnow=0;
let bottles=[], hid=[], hideMode=false;
let lift=[], wob=[], shake=[], corkT=[], appear=[], done=[];
let deadWarned=false, sel=-1, history=[], undos=5, adds=1, undoUsed=0, busy=false, won=false, lost=false, winT=-1, anim=null, pose=null, initSnap='';
let conf=[], fx=[], bgb=[], hint=null, combo=0, lastDone=0, winReward=0, winBase=0;
let timed=false, timeLeft=0, timeTotal=0, lastSec=-1, modals=0, extPause=false, freeHints=0, askCfg=null;
let bw=50, bh=160, pos=[], U=30, LB=0, LT=0, HW=0;

const snap = () => JSON.stringify({b:bottles, h:hid});
function resetVis(){
  const n = bottles.length;
  lift = Array(n).fill(0); wob = Array(n).fill(0); shake = Array(n).fill(0);
  corkT = Array(n).fill(1); appear = Array(n).fill(1); done = bottles.map(isDone); hint = null;
}
function restore(s, keep){                                     // keep=true (undo): bottles bought this level survive
  const o = JSON.parse(s), n = keep ? bottles.length : 0;
  bottles = o.b; hid = o.h;
  while (bottles.length < n){ bottles.push([]); hid.push(0); }
  deadWarned = false; resetVis(); layout();
}
function retrigger(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function openM(id){ const e = $(id); if (!e.classList.contains('hide')) return; e.classList.remove('hide'); modals++; }
function closeM(id){ const e = $(id); if (e.classList.contains('hide')) return; e.classList.add('hide'); modals--; }

// Boosts per level. PRO: unlimited undos and double win coins.
function resetBoosts(){
  const P = params(S.level);
  undos = S.pro ? 999 : P.undos;
  adds = 2;       // Maximum 2 extra bottles per level.
  freeHints = 2;  // 2 paid hints per level; 3rd+ hint requires a rewarded ad.
  undoUsed = 0;
}
function startLevel(){
  const P = params(S.level);
  CAP = P.cap; hideMode = P.hidden;
  deadWarned=false; won=false; lost=false; winT=-1; busy=false; anim=null; pose=null; sel=-1; history=[]; conf=[]; fx=[]; combo=0;
  resetBoosts();
  timed = P.timed; timeTotal = timeLeft = P.time; lastSec = -1;
  bottles = genLevel(S.level, P.nc, P.empties, P.cap);
  hid = bottles.map(b => hideMode ? Math.max(b.length-1, 0) : 0);
  resetVis();
  appear = appear.map((_, i) => -i*0.17);
  normalize(); initSnap = snap(); layout(); ui(); updTimer();
  retrigger($('title'), 'lvlin'); sfx('start'); announce();
  Host.post('analytics', {name:'level_start', params:{level:S.level}});
}
function restartLevel(){
  if (busy) return;
  restore(initSnap); won=false; lost=false; sel=-1; history=[]; combo=0; resetBoosts();
  timeLeft = timeTotal; lastSec = -1; ui(); updTimer(); sfx('undo');
}
function announce(){
  const P = params(S.level); let msg = null;
  const seen = S.kv.seen || (S.kv.seen = {});
  if (S.level > 1 && tier(S.level)[0] !== tier(S.level-1)[0]) msg = tier(S.level)[0] + ' levels!';
  else if (P.timed && !seen.timed){ msg = 'Beat the clock!'; seen.timed = 1; }
  else if (P.hidden && !seen.hidden){ msg = 'Mystery colors!'; seen.hidden = 1; }
  else if (S.level > 1 && P.cap !== params(S.level-1).cap) msg = 'Taller bottles!';
  if (msg){ $('tierB').textContent = msg; retrigger($('tierB'), 'show'); sfx('tier'); Host.post('kv.set', {key:'seen', value:seen}); }
}

let shownCoins = -1;
function ui(){
  const T = tier(S.level);
  $('lvl').textContent = 'Level ' + S.level;
  $('sub').innerHTML = '<span class="tag ' + T[1] + '">' + T[0] + '</span>' + (hideMode ? '<span class="tag t-q">Mystery</span>' : '');
  $('coinN').textContent = S.coins;
  if (shownCoins >= 0 && shownCoins !== S.coins) retrigger($('coins'), 'pop');
  shownCoins = S.coins;
  const bU = $('uN'), bH = $('hN'), bA = $('aN'), hc = S.prices.hint;
  bU.textContent = S.pro ? '\u221E' : (undos > 0 ? undos : '+');
  bU.className = (S.pro || undos > 0) ? '' : 'ad';

  // Hint: maximum 2 coin-paid uses per level, 100 coins per use.
  // After those 2 are used, the next hint is rewarded-ad only.
  bH.textContent = freeHints > 0 ? freeHints : 'AD';
  bH.className = freeHints > 0 ? (S.coins >= hc ? '' : 'ad') : 'ad';

  // Extra bottle: maximum 2 per level, 100 coins per use.
  bA.textContent = adds > 0 ? adds : '0';
  bA.className = adds > 0 && S.coins >= S.prices.bottle ? '' : 'ad';
  $('bUndo').disabled = !history.length;
  $('noads').style.display = (S.noAds || S.pro) ? 'none' : '';
  $('mSound').textContent = 'Sound: ' + (muted ? 'off' : 'on');
  $('mSym').textContent = 'Symbols: ' + (SYMS ? 'on' : 'off');
}
function updTimer(){
  const el = $('timer'); el.classList.toggle('hide', !timed);
  if (!timed) return;
  const t = Math.max(0, timeLeft);
  $('tfill').style.transform = 'scaleX(' + (timeTotal ? t/timeTotal : 0) + ')';
  const s = Math.ceil(t);
  $('ttxt').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  el.classList.toggle('low', t <= 10 && t > 0);
}

/* =====================================================================
   RULES + HINT
   ===================================================================== */
function isDone(a){ return a.length === CAP && a.every(c => c === a[0]); }
function canPour(a, b){
  if (a === b) return 0;
  const A = bottles[a], B = bottles[b];
  if (!A.length || B.length >= CAP) return 0;
  const c = A[A.length-1];
  if (B.length && B[B.length-1] !== c) return 0;
  let run = 0; for (let i = A.length-1; i >= 0 && A[i] === c; i--) run++;
  return Math.min(run, CAP - B.length);
}
function pointless(a, b){ return !bottles[b].length && bottles[a].every(c => c === bottles[a][0]); }
function hasMoves(){
  for (let a = 0; a < bottles.length; a++) for (let b = 0; b < bottles.length; b++)
    if (canPour(a,b) && !pointless(a,b)) return true;
  return false;
}
function findHint(){
  let best = null, bs = -1;
  for (let a = 0; a < bottles.length; a++) for (let b = 0; b < bottles.length; b++){
    const n = canPour(a,b); if (!n || pointless(a,b)) continue;
    const A = bottles[a], B = bottles[b]; let s = n;
    if (B.length) s += 10;
    if (B.length + n === CAP && B.every(c => c === A[A.length-1])) s += 20;
    if (A.length === n) s += 4;
    if (A.length > n && hid[a] >= A.length - n) s += 3;
    if (s > bs){ bs = s; best = [a, b]; }
  }
  return best;
}
function bestHint(){                                           // real solution move; greedy guess only if the search is cut off
  const r = solveInfo(bottles, CAP, 15000);
  if (r.ok) return r.move ? {move: r.move} : null;
  if (!r.cut) return {dead: true};
  const g = findHint(); return g ? {move: g} : null;
}
function deadEnd(){ const r = solveInfo(bottles, CAP, 4000); return !r.ok && !r.cut; }
function normalize(){ bottles.forEach((b,i) => { if (!b.length || isDone(b)) hid[i] = 0; }); }
const isWin = () => bottles.every(b => !b.length || isDone(b));

function pour(a, b, n){
  history.push(snap());
  anim = {a, b, n, c: bottles[a][bottles[a].length-1], t:0, dur: 560 + n*190, side: pos[b].x >= pos[a].x ? 1 : -1};
  busy = true; sel = -1; hint = null; ui();
  sfxPour(anim.dur); vib(12);
}
function finishPour(){
  const {a, b, n} = anim;
  for (let k = 0; k < n; k++) bottles[b].push(bottles[a].pop());
  const L = bottles[a].length;
  let revealed = false;
  if (L > 0 && hid[a] >= L){ hid[a] = L-1; revealed = true; }
  if (L === 0) hid[a] = 0;
  wob[a] = 2.5; wob[b] = 4;
  anim = null; pose = null; busy = false; normalize();
  if (revealed){
    sfx('reveal');
    addFx({t:'ring', x:pos[a].x, y:pos[a].y + LB - (L-0.5)*U, r0:4, r1:bw*0.7, c:'#fff', max:450});
  }
  bottles.forEach((B, i) => {
    const d = isDone(B);
    if (d && !done[i]){
      done[i] = true; corkT[i] = 0;
      const now = performance.now(); combo = (now - lastDone < 7000) ? combo + 1 : 0; lastDone = now;
      celebrate(i, combo);
    } else if (!d) done[i] = false;
  });
  ui();
  if (isWin()) onWin();
  else if (!hasMoves()){ toast(adds > 0 ? 'No moves left. Add a bottle or undo.' : 'No moves left. Undo or restart.'); sfx('stuck'); }
  else if (deadEnd()){ if (!deadWarned){ deadWarned = true; toast('Dead end! Undo a few moves or add a bottle.'); sfx('stuck'); } }
  else deadWarned = false;
}

/* ---- coin economy: Flutter holds the balance, the game asks it to add or spend ---- */
async function addCoins(amount, reason, silent){
  const r = await Host.call('coins.add', {amount, reason});
  S.coins = (r && typeof r.coins === 'number') ? r.coins : S.coins + amount;
  if (!silent) ui();
}
async function spendCoins(amount, reason){
  const r = await Host.call('coins.spend', {amount, reason});
  if (r && typeof r.coins === 'number') S.coins = r.coins;
  ui();
  return !!(r && r.ok);
}
async function showRewarded(placement){                               // true only when the reward was earned
  audioPause();
  const r = await Host.call('ads.rewarded', {placement}, 300000);
  audioResume();
  const got = !!(r && r.rewarded);
  if (!got) toast(r && r.reason === 'unavailable' ? 'No video available right now. Try again later.' : 'Watch the full video to get the reward.');
  return got;
}
// Every boost can be paid with coins OR a rewarded video (always the player's choice).
function askBoost(cfg){

  const c = $('askCoin'), enough = S.coins >= cfg.cost;

function undo(){
  if (busy || won || lost || !history.length) return;
  if (undos <= 0){
    askBoost({title:'Out of undos', text:'Get +' + TUNE.EXTRA_UNDOS + ' undos to keep going.', cost:S.prices.undo, placement:'undo',
      onGrant:() => { undos += TUNE.EXTRA_UNDOS; ui(); toast('+' + TUNE.EXTRA_UNDOS + ' undos'); }});
    return;
  }
  if (!S.pro) undos--;
  undoUsed++;                                                  // counts for PRO too, so stars are earned
  restore(history.pop(), true); sel = -1; ui(); sfx('undo');
}
function grantExtraBottle(){
  if (busy || won || lost) return;                              // ad bottle is a bonus: it never uses up the coin-bottle slots
  bottles.push([]);
  hid.push(0);
  lift.push(0);
  wob.push(0);
  shake.push(0);
  corkT.push(1);
  done.push(false);
  appear.push(0);
  layout();
  ui();
  retrigger($('aN'), 'bump');
  sfx('add');
}

async function addBottleInner(){
  if (busy || won || lost) return;

  // First 2 extra bottles: 100 coins each.
  if (adds > 0){
    const cost = S.prices.bottle;
    if (S.coins < cost){
      toast('You need ' + cost + ' coins for an extra bottle.');
      Host.post('nav', {to:'shop'});
      return;
    }

    if (!await spendCoins(cost, 'bottle')){
      toast('Not enough coins');
      return;
    }

    adds--;
    bottles.push([]);
    hid.push(0);
    lift.push(0);
    wob.push(0);
    shake.push(0);
    corkT.push(1);
    done.push(false);
    appear.push(0);

    layout();
    ui();
    retrigger($('aN'), 'bump');
    sfx('add');
    return;
  }

  // 3rd+ extra bottle: rewarded ad only.
  askBoost({
    title:'Need one more bottle?',
    text:'Watch a short video to add another bottle.',
    cost:0,
    placement:'bottle',
    onGrant:grantExtraBottle
  });
}
function grantExtraHint(){
  if (busy || won || lost) return;

  const hr = bestHint();
  if (!hr || hr.dead){                                         // checked BEFORE any coins or ads are spent
    toast(hr ? 'Dead end! Undo a few moves or add a bottle.' : 'No moves left. Try undo or add a bottle.');
    return;
  }
  const h = hr.move;

  // Rewarded-video hint is an extra use, so it does not consume the 2 paid uses.
  hint = {a:h[0], b:h[1], t:0};
  sel = -1;
  ui();
  sfx('hint');
  Host.post('analytics', {name:'hint_used', params:{level:S.level, method:'rewarded'}});
}

async function useHintInner(){
  if (busy || won || lost) return;

  const hr = bestHint();
  if (!hr || hr.dead){                                         // checked BEFORE any coins or ads are spent
    toast(hr ? 'Dead end! Undo a few moves or add a bottle.' : 'No moves left. Try undo or add a bottle.');
    return;
  }
  const h = hr.move;

  // First 2 hints: 100 coins each.
  if (freeHints > 0){
    const cost = S.prices.hint;
    if (S.coins < cost){
      toast('You need ' + cost + ' coins for a hint.');
      Host.post('nav', {to:'shop'});
      return;
    }

    if (!await spendCoins(cost, 'hint')){
      toast('Not enough coins');
      return;
    }

    freeHints--;
    hint = {a:h[0], b:h[1], t:0};
    sel = -1;
    ui();
    sfx('hint');
    Host.post('analytics', {name:'hint_used', params:{level:S.level, method:'coins'}});
    return;
  }

  // 3rd+ hint: rewarded ad only. No coin purchase.
  askBoost({
    title:'Need another hint?',
    text:'Watch a short video to get another hint.',
    cost:0,
    placement:'hint',
    onGrant:grantExtraHint
  });
}

function countUp(el, to, ms, fmt){
  const t0 = performance.now();
  (function step(now){ const k = Math.min(1, (now - t0) / ms); el.textContent = fmt(Math.round(to * ease(k))); if (k < 1) requestAnimationFrame(step); })(t0);
}
function toast(m){ const e = $('toast'); e.textContent = m; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2400); }
function vib(p){                                                             // haptics are done by Flutter (reliable inside a WebView)
  if (muted || S.haptics === false) return;
  const kind = Array.isArray(p) ? 'heavy' : (p > 15 ? 'medium' : 'light');
  if (IN_APP) Host.post('haptic', {kind}); else if (navigator.vibrate) navigator.vibrate(p);
}

function flyCoins(n, srcEl, done){
  const g = $('game').getBoundingClientRect(), s = srcEl.getBoundingClientRect(), d = $('coins').getBoundingClientRect();
  const sx = s.left + s.width/2 - g.left, sy = s.top + s.height/2 - g.top, dx = d.left + 24 - g.left - sx, dy = d.top + d.height/2 - g.top - sy;
  let left = n;
  const fin = () => { if (--left <= 0 && done) done(); };
  for (let i = 0; i < n; i++){
    const c = document.createElement('i'); c.className = 'fc'; c.style.left = sx + 'px'; c.style.top = sy + 'px'; $('game').appendChild(c);
    if (!c.animate){ c.remove(); fin(); continue; }
    const ox = (Math.random()-.5)*110, oy = (Math.random()-.5)*70;
    const a = c.animate([
      {transform:'translate(-50%,-50%) scale(.3)', opacity:0},
      {transform:'translate(calc(-50% + ' + ox + 'px),calc(-50% + ' + oy + 'px)) scale(1)', opacity:1, offset:.3},
      {transform:'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px)) scale(.7)', opacity:1}
    ], {duration:900, delay:i*55, easing:'cubic-bezier(.5,0,.6,1)', fill:'both'});
    a.onfinish = () => { c.remove(); tone(1100 + (i%6)*90, 0.06, {type:'triangle', vol:0.08}); fin(); };
  }
}

function adGate(level){                                       // wait for the interstitial, but never trap the player
  return new Promise(resolve => {
    let fin = false; const t0 = performance.now();
    const end = () => { if (fin) return; fin = true; clearInterval(iv); resolve(); };
    const iv = setInterval(() => { const e = performance.now() - t0; if ((e > 20000 && !extPause) || e > 90000) end(); }, 500);
    Host.call('ads.interstitial', {level}, 95000).then(end, end);
  });
}

};

function applyState(st, first){
  const wasPro = S.pro;
  if (typeof st.coins === 'number') S.coins = st.coins;
  if (first && typeof st.level === 'number') S.level = Math.max(1, st.level);
  ['noAds','pro','haptics','kv'].forEach(k => { if (st[k] !== undefined) S[k] = st[k]; });
  if (st.kv && st.kv.symbols !== undefined) SYMS = isOn(st.kv.symbols);
  if (st.prices) Object.assign(S.prices, st.prices);
  if (st.muted !== undefined) muted = !!st.muted;
  if (st.skin) SKIN = Object.assign({}, DEFAULT_SKIN, st.skin);
  if (st.bg) applyBg(st.bg);
  if (S.pro && !wasPro && !first){ undos = 999; toast('PRO unlocked. Enjoy!'); sfx('buy'); }
  ui();
}

/* =====================================================================
   DIFFICULTY LADDER (all in one place)
   colors   4 at level 1, +1 every 2 levels, 12 max (level 18)
   empties  2 bottles, 1 from level 25 (from level 80 on mystery levels too)
   mystery  every 3rd level from 3, every 2nd from 30
   timed    every 5th level from 40 (countdown, shrinks slowly with level)
   depth    bottles hold 4 units, 5 from level 50, 6 from level 120
   undos    5, minus 1 every 20 levels (min 2)
   ===================================================================== */
function params(lv){
  const hidden = lv >= 3 && (lv < 30 ? lv % 3 === 0 : lv % 2 === 0);
  const timed = lv >= 40 && lv % 5 === 0;
  const cap = lv >= 120 ? 6 : lv >= 50 ? 5 : 4;
  const nc = Math.min(3 + Math.ceil(lv/2), 12);
  const empties = (lv >= 25 && (!hidden || lv >= 80)) ? 1 : 2;
  const time = timed ? Math.round((40 + nc*12 + cap*6) * Math.max(0.7, 1 - (lv-40)*0.003)) : 0;
  return {nc, cap, hidden, timed, time, empties, undos: Math.max(2, 5 - Math.floor(lv/20))};
}
function tier(lv){

/* =====================================================================
   LEVEL GENERATOR: always solvable, and level N is always the same puzzle (seeded)
   Start from the solved state and make random REVERSE pours. Reverse moves that
   put a unit on a different color are favoured, so the start state is well mixed.
   ===================================================================== */
function seeded(seed){
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  for (let i = u.length-1; i > 0; i--){ const j = R() * (i+1) | 0; [u[i], u[j]] = [u[j], u[i]]; }
  const b = []; for (let i = 0; i < nc; i++) b.push(u.slice(i*cap, (i+1)*cap));

// Depth-first solver with move ordering. Used to prove a random deal is solvable.
function solvable(b0, cap, limit){

    if (fin(b)) return true;

    const key = b.map(x => x.join(',')).sort().join('|');
    if (seen.has(key)) return false; seen.add(key);

      const A = b[a]; if (!A.length) continue;
      const c = A[A.length-1]; let run = 0; for (let i = A.length-1; i >= 0 && A[i] === c; i--) run++;

        if (B.length && B[B.length-1] !== c) continue;

      const nb = b.map(x => x.slice()); for (let i = 0; i < n; i++) nb[d].push(nb[a].pop());

    const key = b.map(x => x.join(',')).sort().join('|');
    if (seen.has(key)) return false; seen.add(key);
    const mv = [];
    for (let a = 0; a < b.length; a++){
      const A = b[a]; if (!A.length) continue;
      const c = A[A.length-1]; let run = 0; for (let i = A.length-1; i >= 0 && A[i] === c; i--) run++;
      const uni = A.every(x => x === c);
      for (let d = 0; d < b.length; d++){
        const B = b[d]; if (a === d || B.length >= cap) continue;
        if (B.length && B[B.length-1] !== c) continue;
        if (!B.length && uni) continue;
        const n = Math.min(run, cap - B.length); let sc = n;
        if (B.length){ sc += 10; if (B.length + n === cap && B.every(x => x === c)) sc += 50; }
        if (A.length === n) sc += 5;
        mv.push([sc, a, d, n]);
      }
    }
    mv.sort((p, q) => q[0] - p[0]);
    for (const [, a, d, n] of mv){
      const nb = b.map(x => x.slice()); for (let i = 0; i < n; i++) nb[d].push(nb[a].pop());

function genWalk(lv, nc, empties, cap){
  const R = seeded(lv * 7919 + 12345);
  const target = Math.min(0.35 + lv*0.008, 0.78) * nc * (cap-1);
  const tries = lv < 10 ? 25 : 40;
  let best = null, bestScore = -1e9;
  for (let attempt = 0; attempt < tries; attempt++){
    const b = [];
    for (let i = 0; i < nc; i++) b.push(Array(cap).fill(i));
    for (let e = 0; e < empties; e++) b.push([]);
    const steps = Math.min(2600, Math.round((100 + nc*50 + lv*3) * cap / 4));
    for (let s = 0; s < steps; s++){
      const mv = [], wt = []; let sum = 0;
      for (let y = 0; y < b.length; y++){
        const Y = b[y]; if (!Y.length) continue;
        const u = Y[Y.length-1];
        if (Y.length > 1 && Y[Y.length-2] !== u) continue;
        for (let x = 0; x < b.length; x++){
          if (x === y || b[x].length >= cap) continue;
          const w = (b[x].length && b[x][b[x].length-1] !== u) ? 3 : 1;
          mv.push([y, x]); wt.push(w); sum += w;
        }
      }
      if (!mv.length) break;
      let r = R() * sum, k = 0; while (k < mv.length - 1 && r >= wt[k]){ r -= wt[k]; k++; }
      b[mv[k][1]].push(b[mv[k][0]].pop());
    }
    const done = b.filter(a => a.length === cap && a.every(c => c === a[0])).length;
    let mix = 0; for (const a of b) for (let k = 1; k < a.length; k++) if (a[k] !== a[k-1]) mix++;
    const score = mix - done*3;
    if (score > bestScore){ best = b; bestScore = score; }
    if (mix >= target && (done === 0 || (lv < 10 && done <= Math.floor(nc/4)))) return b;
  }
  return best;
}
// Level 1-11 and every 1-empty level: reverse walk (gentle curve / guaranteed solvable).
// Level 12+ with 2 empties: fully random deals, kept only if the solver proves them solvable.
function genLevel(lv, nc, empties, cap){
  if (lv >= 12 && empties >= 2){
    const R = seeded(lv * 104729 + 777);
    for (let t = 0; t < 6; t++){
      const b = dealRandom(nc, empties, cap, R);
      if (b.some(a => a.length === cap && a.every(c => c === a[0]))) continue;
      if (solvable(b, cap, 30000)) return b;
    }
  }
  return genWalk(lv, nc, empties, cap);
}

function areaBelow(poly, y){
  const out = [];

    const p = poly[i], q = poly[(i+1) % poly.length], pi = p.y >= y, qi = q.y >= y;

    if (pi !== qi){ const t = (y - p.y) / (q.y - p.y); out.push({x: p.x + (q.x-p.x)*t, y}); }
  }

  for (let i = 0; i < out.length; i++){ const p = out[i], q = out[(i+1) % out.length]; a += p.x*q.y - q.x*p.y; }

}

  const n = 7.5625, d = 2.75;

  if (t < 2/d){ t -= 1.5/d; return n*t*t + .75; }
  if (t < 2.5/d){ t -= 2.25/d; return n*t*t + .9375; }

}

    else if (p.t === 'bubble'){ ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.stroke(); }
    else if (p.t === 'text'){
      ctx.globalAlpha = k < 0.7 ? 1 : (1 - k)/0.3; const sc = 0.6 + 0.4*Math.min(1, k*6) + (k < 0.15 ? 0.25*Math.sin(k/0.15*Math.PI) : 0);
      ctx.translate(p.x, p.y); ctx.scale(sc, sc);
      ctx.font = '700 ' + p.size + 'px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(10,12,30,.85)'; ctx.strokeText(p.txt, 0, 0); ctx.fillStyle = p.c; ctx.fillText(p.txt, 0, 0);
    }
    ctx.restore();
  }
  for (const p of conf){
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.r/2, p.s, p.r + 2); ctx.restore();
  }
}

/* =====================================================================
   LOOP
   ===================================================================== */
let last = performance.now();
function frame(t){
  const dt = Math.min(50, t - last); last = t; tnow = t;
  const f = dt / 16.67, decay = Math.exp(-dt/350);
  for (let i = 0; i < bottles.length; i++){
    lift[i] += ((sel === i ? 1 : 0) - lift[i]) * Math.min(1, dt/60);
    wob[i] *= decay; if (shake[i] > 0) shake[i] = Math.max(0, shake[i] - dt);
    if (appear[i] < 1) appear[i] = Math.min(1, appear[i] + dt/380);
    if (corkT[i] < 1) corkT[i] = Math.min(1, corkT[i] + dt/500);
  }
  if (hint){ hint.t += dt; if (hint.t > 3500) hint = null; }
  if (timed && !won && !lost && modals === 0 && !extPause){                                   // countdown on timed levels
    timeLeft = Math.max(0, timeLeft - dt/1000); updTimer();
    const s = Math.ceil(timeLeft); if (s !== lastSec){ lastSec = s; if (s <= 10 && s > 0) sfx('tick'); }
    if (timeLeft <= 0 && !busy) onLose();
  }
  if (anim){
    anim.t += dt / anim.dur;
    if (anim.t >= 1) finishPour();
    else {
      pose = srcPose();
      if (pose.k >= 1 && pose.p < 1){
        wob[anim.b] = Math.max(wob[anim.b], 2.2);
        addFx({t:'drop', x: pose.mx, y: pose.surf, vx: (Math.random()-.5)*3, vy: -1.5 - Math.random()*2, g: 0.18, r: 1.5 + Math.random()*1.5, c: PAL[anim.c], max: 420});
        if (Math.random() < 0.35) addFx({t:'bubble', x: pos[anim.b].x + (Math.random()-.5)*bw*0.6, y: pose.surf + 14 + Math.random()*10, vy: -0.5, r: 1.5 + Math.random()*2, max: 400});
      }
    }
  }
  if (winT >= 0) winT += dt;
  fx = fx.filter(p => { p.life += dt; p.x += (p.vx||0)*f; p.y += (p.vy||0)*f; p.vy = (p.vy||0) + (p.g||0)*f; return p.life < p.max; });
  conf = conf.filter(p => { p.vy += .28*f; p.x += p.vx*f; p.y += p.vy*f; p.rot += p.vr*f; return p.y < H + 30; });
  for (const b of bgb){ b.y -= b.s*f; if (b.y < -10){ b.y = H + 10; b.x = Math.random()*W; } }
  draw();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
async function boot(){
  let st = null;
  try { st = await Host.call('boot', {}, 15000); } catch(e){}
  if (!st || st.error) st = {};
  applyState(st, true);
  if (!st.kv || st.kv.symbols === undefined){ try { SYMS = localStorage.getItem('ws_syms') === '1'; ui(); } catch(e){} }
  if (st.debug) window.setLevel = n => { S.level = n; ['win','lose'].forEach(id => $(id).classList.add('hide')); startLevel(); };
  try { if (document.fonts) await Promise.race([document.fonts.load('700 20px Fredoka'), new Promise(r => setTimeout(r, 800))]); } catch(e){}
  resize(); startLevel(); requestAnimationFrame(frame);
  Host.post('ready', {});
}
resize(); boot();
</script>
